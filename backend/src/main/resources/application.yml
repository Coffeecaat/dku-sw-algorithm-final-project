server:
  port: 8080

spring:
  application:
    name: cafe-map-algorithm-lab
  datasource:
    url: jdbc:h2:mem:cafe-map-lab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/common

app:
  cors:
    allowed-origins:
      - http://localhost:5173
