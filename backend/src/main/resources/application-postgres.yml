spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/cafe_map_lab}
    username: ${DATABASE_USERNAME:cafe_lab}
    password: ${DATABASE_PASSWORD:cafe_lab}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgres
