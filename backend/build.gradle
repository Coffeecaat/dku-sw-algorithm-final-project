plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    implementation 'org.hibernate.orm:hibernate-spatial'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'performance'
    }
}

tasks.register('performanceTest', Test) {
    description = 'Runs performance-ish integration scenarios for report measurements.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'performance'
    }
    shouldRunAfter test
}

tasks.register('dbPerformanceTest', Test) {
    description = 'Runs database-backed performance scenarios against the selected Spring profile.'
    group = 'verification'
    def selectedDbProfile = System.getProperty('dbProfile', 'postgres')
    useJUnitPlatform {
        includeTags 'db-performance'
    }
    systemProperty 'spring.profiles.active', selectedDbProfile
    systemProperty 'db.profile.label', selectedDbProfile
    systemProperty 'spring.datasource.url', System.getProperty(
            'dbUrl',
            selectedDbProfile == 'mysql'
                    ? 'jdbc:mysql://localhost:3307/cafe_map_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul'
                    : 'jdbc:postgresql://localhost:55432/cafe_map_lab')
    systemProperty 'spring.datasource.username', System.getProperty('dbUsername', 'cafe_lab')
    systemProperty 'spring.datasource.password', System.getProperty('dbPassword', 'cafe_lab')
    systemProperty 'perfCafeCount', System.getProperty('perfCafeCount', '1000')
    systemProperty 'perfIncludeExpensiveStrategies', System.getProperty('perfIncludeExpensiveStrategies', 'true')
    shouldRunAfter test
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
